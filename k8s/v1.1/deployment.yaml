apiVersion: v1
kind: ConfigMap
metadata:
  name: product-catalogue-config
  namespace: product-catalogue-v1-1
data:
  NODE_ENV: "production"
  PORT: "3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalogue
  namespace: product-catalogue-v1-1
  labels:
    app: product-catalogue
    version: v1.1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-catalogue
      version: v1.1
  template:
    metadata:
      labels:
        app: product-catalogue
        version: v1.1
    spec:
      containers:
        - name: product-catalogue
          # Replace with your own registry/user before pushing.
          image: REPLACE_WITH_YOUR_DOCKERHUB_USER/product-catalogue:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: product-catalogue-config
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
