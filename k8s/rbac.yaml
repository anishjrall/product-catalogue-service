# Bonus: RBAC policies to restrict permissions
#
# Example of least-privilege access: a "product-catalogue-viewer" service
# account (e.g. for a monitoring/CI job) that can only READ pods/services/
# deployments in each version's namespace - no write access, no cluster-wide
# access. Apply per-namespace (this file assumes the three namespaces from
# k8s/v1, k8s/v1.1, k8s/v2 already exist).

apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-catalogue-viewer
  namespace: product-catalogue-v1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-catalogue-viewer
  namespace: product-catalogue-v1-1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-catalogue-viewer
  namespace: product-catalogue-v2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: product-catalogue-viewer-role
  namespace: product-catalogue-v1
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "services", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: product-catalogue-viewer-role
  namespace: product-catalogue-v1-1
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "services", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: product-catalogue-viewer-role
  namespace: product-catalogue-v2
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "services", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: product-catalogue-viewer-binding
  namespace: product-catalogue-v1
subjects:
  - kind: ServiceAccount
    name: product-catalogue-viewer
    namespace: product-catalogue-v1
roleRef:
  kind: Role
  name: product-catalogue-viewer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: product-catalogue-viewer-binding
  namespace: product-catalogue-v1-1
subjects:
  - kind: ServiceAccount
    name: product-catalogue-viewer
    namespace: product-catalogue-v1-1
roleRef:
  kind: Role
  name: product-catalogue-viewer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: product-catalogue-viewer-binding
  namespace: product-catalogue-v2
subjects:
  - kind: ServiceAccount
    name: product-catalogue-viewer
    namespace: product-catalogue-v2
roleRef:
  kind: Role
  name: product-catalogue-viewer-role
  apiGroup: rbac.authorization.k8s.io
