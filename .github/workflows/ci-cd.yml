name: CI/CD

on:
  push:
    branches: [master, main, "release/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master, main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/product-catalogue

jobs:
  # ---------------------------------------------------------------------
  # 1. Unit tests - fast, no Docker/K8s needed. Runs on every push and PR.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  # ---------------------------------------------------------------------
  # 2. Build the Docker image and push it to Docker Hub.
  #    Tag with both the git ref and `latest` for convenience.
  # ---------------------------------------------------------------------
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  # ---------------------------------------------------------------------
  # 3. Deploy to a throwaway Kubernetes cluster (kind, running inside the
  #    runner) and hit the live service to confirm the deploy actually
  #    works end-to-end. This substitutes for a real cluster in CI; point
  #    KUBECONFIG at your own cluster to deploy for real (see README).
  # ---------------------------------------------------------------------
  deploy-and-integration-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: product-catalogue-ci

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Load built image into kind
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          docker pull ${{ env.IMAGE_NAME }}:${TAG}
          kind load docker-image --name product-catalogue-ci ${{ env.IMAGE_NAME }}:${TAG}

      - name: Substitute image tag into manifests
        run: |
          TAG=${{ needs.build-and-push.outputs.image_tag }}
          for dir in k8s/v1 k8s/v1.1 k8s/v2; do
            sed -i "s#REPLACE_WITH_YOUR_DOCKERHUB_USER/product-catalogue:.*#${{ env.IMAGE_NAME }}:${TAG}#" "$dir/deployment.yaml"
          done

      - name: Deploy v1 (as a representative smoke test)
        run: |
          kubectl apply -f k8s/v1/namespace.yaml
          kubectl apply -f k8s/v1/deployment.yaml
          kubectl apply -f k8s/v1/service.yaml
          kubectl apply -f k8s/v1/hpa.yaml
          kubectl -n product-catalogue-v1 rollout status deployment/product-catalogue --timeout=120s

      - name: Run integration test against the deployed pod
        run: |
          kubectl -n product-catalogue-v1 port-forward svc/product-catalogue-svc 8080:80 &
          sleep 5
          curl --fail http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/products
